work:
  - name: "FULFLLD, Inc."
    website: "https://fulflld.com"
    location: "New York (Remote)"
    position: "Engineering Manager"
    startDate: "2024-11-15"
    summary: >
      Lead architect of a multi-tenant logistics SaaS platform. Owns end-to-end system architecture, state invariants,
      and core implementation in Go and Rust, focusing on service boundaries, data modeling, and runtime reliability
      across a distributed engineering team.
    highlights:
      - "**Core Systems Migration:** Led the transition from loosely typed JavaScript proof-of-concept services to deterministic **Go** microservices, enforcing strict schema contracts and reducing runtime memory footprint."
      - "**High-Throughput Scalability:** Re-architected the Orders API and its MongoDB schemas and indexes, scaling throughput from ~700 to 10,000+ concurrent orders per workspace."
      - "**Fleet Dispatching Engine:** Designed a multi-driver bulk routing engine and real-time location trail data model, replacing manual order coordination."
      - "**Geofence Verification:** Engineered geospatial index proximity verification to deterministically confirm vehicle presence within delivery geofences for dispute resolution."
      - "**Telemetry Pipeline:** Architected driver location ingestion on MongoDB Time Series collections, cutting storage overhead while sustaining high-frequency writes."
      - "**Asynchronous Isolation:** Decoupled long-running operations from the synchronous request path using RabbitMQ workers, improving platform uptime under load."
      - "**Architectural Governance:** Defined platform direction through RFCs, led live production incident resolution, and enforced structural invariants across core service reviews."
  - name: "COdesign Ltd."
    website: "https://co.design"
    location: "Dhaka"
    position: "Technology Director"
    startDate: "2017-02-04"
    endDate: "2024-11-14"
    summary: >
      Principal architect and technical authority across client and internal platforms. Designed system architectures,
      wrote core backend services, and led platform migrations while establishing enduring engineering processes.
    highlights:
      - "**Platform Re-architecture:** Migrated client platforms from monolithic WordPress to decoupled Django and Wagtail CMS backends with SSR Vue.js frontends, improving latency and search rankings."
      - "**Resource-Constrained Systems:** Architected and built BRAC's e-learning platform (Django, Vue.js), serving 90,000+ active users on a single 4 GB RAM / 2 vCPU server through lean query and caching design."
      - "**Compliance & Verification Platform:** Designed a factory safety, workshop tracking, and audit certification system for BRAC with multi-tier enrollment and staged verification state models."
      - "**Delivery Process:** Introduced automated testing and CI/CD pipelines, cutting end-to-end delivery cycles by 33%."
      - "**Engineering Standards & Mentoring:** Built the division's core engineering workflows and internal frameworks, mentoring engineers into structured, self-reliant systems builders."
      - "**Enterprise Frontend Architecture:** Implemented frontend architecture and localization for Toyota Bangladesh to Toyota's global standards, and modernized Prothom Alo's frontend platform."
      - "**Internal Open Source:** Founded the company's open-source program, shipping shared utility packages and developer tooling across engineering teams."
  - name: "Panacea Systems Ltd."
    location: "Dhaka"
    position: "DevOps Programmer"
    startDate: "2015-06-01"
    endDate: "2016-09-30"
    summary: >
      Infrastructure and systems programmer at a fintech company, owning bare-metal virtualization, automated
      deployment pipelines, and message-parsing backend services.
    highlights:
      - "**Bare-Metal Private Cloud:** Architected and deployed an on-premises OpenStack private cloud from scratch in 7 days (live demo in 3) without prior documentation, hosting core fintech production workloads."
      - "**Transactional NLP Parser:** Built a parser and context classifier for transactional messaging APIs, converting unstructured messages into deterministic structured payloads."
      - "**Deployment Automation:** Engineered isolated environments and continuous deployment pipelines so fintech services were built, verified, and shipped to the private cloud automatically."
projects:
  - name: "Meghnaad"
    startDate: "2026-01-01"
    description: >
      Local-first Taskwarrior sync engine and superset written in Rust and compiled to WebAssembly, running on
      Cloudflare Workers and R2. Delivers multi-device sync, Kanban boards, and dashboards in the user plane while
      preserving strict schema and behavioral parity with the upstream `task` CLI.
    highlights:
      - "**Strict Plane Separation:** Kept the storage and sync plane 100% compatible with native Taskwarrior data models while projecting Kanban boards and dashboards purely in the user plane via User Defined Attributes (UDAs)."
      - "**Spec-Driven Governance:** Engineered with immutable specifications, explicit architectural boundary guardrails, and acceptance criteria verified against the upstream `task` 3.5.0 binary."
      - "**Entropy & Smell Audits:** Enforced a ratcheting Clippy static-analysis baseline and scheduled architectural `(smells)` audits every 10,000 lines of edits to prevent structural drift across AI-assisted development."
    website: "https://github.com/uroybd/Meghnaad"
  - name: "DotR"
    startDate: "2025-11-17"
    description: >
      Dotfiles manager written in Rust, distributed on crates.io and Homebrew as a single static binary.
      Manages per-machine configuration with profiles, Tera templates, layered variables and pluggable secret storage.
    highlights:
      - "**Configuration Design:** A five-level variable precedence (config → environment → package → profile → user secrets) and a dependency-aware package graph let one repository adapt to every machine without duplicated config."
      - "**Pluggable Secret Backends:** Three interchangeable backends: a gitignored TOML file, the OS keychain, and Bitwarden, including full `bw` session handling."
      - "**Release Engineering:** Cross-platform builds (macOS/Linux, x86_64/aarch64, glibc/musl), mdBook documentation, Codecov test coverage and `cargo vet` supply-chain auditing."
    website: "https://dotr.utsob.me"
  - name: "BooxRichAnnotations"
    startDate: "2026-06-01"
    description: >
      Native Android app for Onyx Boox e-readers that exports reading annotations, including metadata NeoReader
      does not expose, by reading its system content providers directly.
    highlights:
      - "**Reverse Engineering:** Mapped NeoReader's proprietary ContentProvider schemas to recover hidden annotation data: colors, highlight styles, chapter context and position."
      - "**Export Pipeline:** Export engine with deduplication, configurable destinations, and JSON, CSV and Pebble-templated Markdown output."
      - "**E-ink Design Constraints:** Held strict e-ink UI rules across 12 releases: no animations, high-contrast monochrome layouts, large type and 48dp touch targets."
    website: "https://github.com/uroybd/BooxRichAnnotations"
  - name: "Advent of Code Solutions"
    startDate: "2015-12-01"
    description: >
      85+ algorithm and graph problems solved in Rust across six years (2015, 2021–2025), focused on state-space
      reduction and sub-millisecond runtimes tracked with Criterion benchmarks.
    highlights:
      - "**Algorithm Design:** Const-generic A* search, bitmask-compressed dynamic programming over graph states, and inclusion–exclusion over 3D cuboid intersections."
      - "**Performance Engineering:** Criterion benchmark harness with baseline diffing to catch regressions, plus Rayon parallelism and fxhash in hot paths."
    website: "https://github.com/uroybd/AdventOfCode"
