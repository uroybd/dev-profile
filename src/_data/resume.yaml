work:
  - name: "FULFLLD, Inc."
    website: "https://fulflld.com"
    location: "New York (Remote)"
    position: "Engineering Manager"
    startDate: "2024-11-15"
    summary: >
      Lead architect of a multi-tenant logistics SaaS platform. Owns the platform's architecture and writes much of
      its core code in Go and Rust, with a focus on service design, data modeling and runtime performance. Most of the
      role is architecture and implementation; the rest is asynchronous technical alignment with a distributed team.
    highlights:
      - "**Legacy Modernization:** Led the migration of legacy JavaScript proof-of-concept code to Go microservices, adding strict typing and reducing runtime memory use."
      - "**Scalability:** Redesigned the Orders API and its MongoDB schemas and indexes, raising capacity from ~700 to 10,000+ concurrent orders per workspace."
      - "**Fleet Dispatching:** Designed a multi-driver bulk routing engine that replaced manual order coordination, including the data model for real-time driver location trails."
      - "**Geofence Verification:** Built a proximity check on geospatial indexes that confirms a vehicle was inside the delivery geofence, used to settle customer disputes."
      - "**Telemetry Pipeline:** Designed driver location tracking on MongoDB Time Series collections, cutting storage overhead while handling high-frequency location writes."
      - "**Asynchronous Processing:** Moved long-running operations off the request path into a RabbitMQ-based background worker, improving platform uptime."
      - "**Technical Direction:** Set the platform's architecture direction through RFCs and design documents for infrastructure overhauls, and review design and code changes to core services so collaborating developers have clear implementation paths."
  - name: "COdesign Ltd."
    website: "https://co.design"
    location: "Dhaka"
    position: "Technology Director"
    startDate: "2017-02-04"
    endDate: "2024-11-14"
    summary: >
      Principal architect and technical authority for client and internal platforms. Designed the systems, wrote
      backend code and led migrations, while mentoring engineers and working with design and business teams.
    highlights:
      - "**Platform Re-architecture:** Led the move of client platforms from monolithic WordPress to a decoupled Django and Wagtail CMS backend with a server-side-rendered Vue.js frontend, improving page load times and SEO."
      - "**Design for Constrained Resources:** Designed and built BRAC's e-learning platform (Django, Vue.js), including a modular course dashboard and question bank, serving 90,000+ active users on a single 4 GB RAM / 2 vCPU server."
      - "**Compliance Platform:** Built a factory safety, workshop tracking and audit certification platform for BRAC, with data models for multi-tier corporate and worker enrollment and staged verification."
      - "**Delivery Process:** Introduced automated testing and CI/CD pipelines, cutting end-to-end delivery cycles by 33%."
      - "**Engineering Culture & Mentoring:** Built the technology division's engineering processes and internal frameworks and mentored engineers, giving the division a more structured, scalable way of working."
      - "**Frontend Architecture:** Implemented the frontend structure and localization for Toyota Bangladesh to Toyota's global UI standards, and modernized Prothom Alo's frontend platform."
      - "**Internal Open Source:** Started the company's open-source program, building and releasing utility packages and developer tools used across engineering."
  - name: "Panacea Systems Ltd."
    location: "Dhaka"
    position: "DevOps Programmer"
    startDate: "2015-06-01"
    endDate: "2016-09-30"
    summary: >
      Infrastructure and systems programmer at a fintech company, responsible for server virtualization,
      deployment pipelines and custom backend services.
    highlights:
      - "**Private Cloud:** Built an on-premises OpenStack private cloud on bare-metal servers to host core production workloads."
      - "**NLP Parser:** Built a parser and context classifier for transactional messaging APIs, turning unstructured messages into structured backend data."
      - "**Deployment Pipelines:** Set up isolated environments and continuous deployment so fintech services were built, tested and shipped to the private cloud automatically."
projects:
  - name: "DotR"
    startDate: "2025-11-17"
    description: >
      Dotfiles manager written in Rust, distributed on crates.io and Homebrew as a single static binary.
      Manages per-machine configuration with profiles, Tera templates, layered variables and pluggable secret storage.
    highlights:
      - "**Configuration Design:** A five-level variable precedence (config → environment → package → profile → user secrets) and a dependency-aware package graph let one repository adapt to every machine without duplicated config."
      - "**Pluggable Secret Backends:** Three interchangeable backends: a gitignored TOML file, the OS keychain, and Bitwarden, including full `bw` session handling."
      - "**Release Engineering:** Cross-platform builds (macOS/Linux, x86_64/aarch64, glibc/musl), mdBook documentation, Codecov test coverage and `cargo vet` supply-chain auditing."
    website: "https://dotr.utsob.me"
  - name: "BooxRichAnnotations"
    startDate: "2026-06-01"
    description: >
      Native Android app for Onyx Boox e-readers that exports reading annotations, including metadata NeoReader
      does not expose, by reading its system content providers directly.
    highlights:
      - "**Reverse Engineering:** Mapped NeoReader's proprietary ContentProvider schemas to recover hidden annotation data: colors, highlight styles, chapter context and position."
      - "**Export Pipeline:** Export engine with deduplication, configurable destinations, and JSON, CSV and Pebble-templated Markdown output."
      - "**E-ink Design Constraints:** Held strict e-ink UI rules across 12 releases: no animations, high-contrast monochrome layouts, large type and 48dp touch targets."
    website: "https://github.com/uroybd/BooxRichAnnotations"
  - name: "Advent of Code Solutions"
    startDate: "2015-12-01"
    description: >
      85+ algorithm and graph problems solved in Rust across six years (2015, 2021–2025), focused on state-space
      reduction and sub-millisecond runtimes tracked with Criterion benchmarks.
    highlights:
      - "**Algorithm Design:** Const-generic A* search, bitmask-compressed dynamic programming over graph states, and inclusion–exclusion over 3D cuboid intersections."
      - "**Performance Engineering:** Criterion benchmark harness with baseline diffing to catch regressions, plus Rayon parallelism and fxhash in hot paths."
    website: "https://github.com/uroybd/AdventOfCode"
